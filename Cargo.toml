[package]
name = "cytrick"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
home = "0.5.12"
noyalib = "0.0.63"
onpath = "0.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
symlink = "0.1.0"
zip = "9.7.3"
