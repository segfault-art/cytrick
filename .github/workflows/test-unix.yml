name: test-unix
on: workflow_dispatch

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Setup
        run: target/release/cytrick setup
      - name: Install
        run: target/release/cytrick run
      - name: Test
        run: cyt version