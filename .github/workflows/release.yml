name: release
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # necessário para criar/editar o release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: cytrick-linux-x86_64
            bin: cytrick
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: cytrick-linux-aarch64
            bin: cytrick
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: cytrick-windows-x86_64.exe
            bin: cytrick.exe
          - os: macos-13
            target: x86_64-apple-darwin
            name: cytrick-macos-x86_64
            bin: cytrick
          - os: macos-latest
            target: aarch64-apple-darwin
            name: cytrick-macos-aarch64
            bin: cytrick

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.name }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}