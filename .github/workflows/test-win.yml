name: test-win
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
    paths-ignore: [ '**.md' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Setup
        run: target\release\cytrick.exe setup
      - name: Install
        run: target\release\cytrick.exe run
      - name: Test
        run: '%USERPROFILE%\.cytrick\bin\cyt version'